<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MountPeak Group Admin</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="styles-extra.css"><style>body{background:#f6f9fc}.admin{max-width:1200px;margin:auto;padding:35px 20px}.panel{background:#fff;border:1px solid #e5eaf0;border-radius:12px;padding:20px;margin:16px 0;overflow:auto}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.stat{background:#fff;border:1px solid #e5eaf0;border-radius:10px;padding:18px}.stat b{display:block;font-size:26px;color:#071a3a}.stat span{font-size:11px;color:#64748b}table{width:100%;border-collapse:collapse;font-size:12px}th,td{text-align:left;padding:11px;border-bottom:1px solid #e5eaf0;white-space:nowrap}th{font-size:11px}.login{max-width:420px;margin:10vh auto;background:#fff;padding:30px;border-radius:12px;border:1px solid #e5eaf0}.login input{display:block;width:100%;padding:12px;margin:8px 0 14px;border:1px solid #d7e0ea;border-radius:6px}.hidden{display:none}@media(max-width:800px){.stats{grid-template-columns:1fr 1fr}}</style></head><body><main class="admin"><section id="login" class="login"><p class="eyebrow">MOUNTPEAK GROUP</p><h1>Admin Login</h1><input id="email" type="email" placeholder="Admin email"><input id="password" type="password" placeholder="Password"><button id="loginBtn" class="button primary">Sign in</button><p id="loginMsg" class="form-message"></p></section><section id="dashboard" class="hidden"><header style="display:flex;justify-content:space-between;align-items:center"><div><p class="eyebrow">ADMIN CONTROL CENTER</p><h1>MountPeak Group</h1></div><button id="logout" class="button outline-dark">Log out</button></header><div class="stats"><div class="stat"><b id="candidates">0</b><span>Candidates</span></div><div class="stat"><b id="contacts">0</b><span>Contact inquiries</span></div><div class="stat"><b id="payments">0</b><span>Payments</span></div><div class="stat"><b id="paidAmount">$0</b><span>Paid amount</span></div></div><div class="panel"><h2>Candidates</h2><table><thead><tr><th>ID</th><th>Name</th><th>Email</th><th>Role</th><th>Visa</th><th>Status</th><th>Created</th></tr></thead><tbody id="candidateRows"></tbody></table></div><div class="panel"><h2>Payments</h2><table><thead><tr><th>ID</th><th>Transaction</th><th>Candidate</th><th>Provider</th><th>Method</th><th>Amount</th><th>Status</th><th>Created</th></tr></thead><tbody id="paymentRows"></tbody></table></div><div class="panel"><h2>Contact inquiries</h2><table><thead><tr><th>ID</th><th>Name</th><th>Email</th><th>Phone</th><th>Status</th><th>Created</th></tr></thead><tbody id="contactRows"></tbody></table></div></section></main><script>
let token=localStorage.getItem('mpg_admin_token');const $=id=>document.getElementById(id);function showDash(){ $('login').classList.add('hidden');$('dashboard').classList.remove('hidden');load(); } async function api(path,opt={}){opt.headers={...(opt.headers||{}),Authorization:`Bearer ${token}`};const r=await fetch(`/api${path}`,opt);if(r.status===401){localStorage.removeItem('mpg_admin_token');location.reload()}return r.json()}
$('loginBtn').onclick=async()=>{const r=await fetch('/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:$('email').value,password:$('password').value})});const d=await r.json();if(!r.ok){$('loginMsg').textContent=d.message;return}token=d.token;localStorage.setItem('mpg_admin_token',token);showDash()};$('logout').onclick=()=>{localStorage.removeItem('mpg_admin_token');location.reload()};
async function load(){const d=await api('/admin/dashboard');$('candidates').textContent=d.candidates;$('contacts').textContent=d.contacts;$('payments').textContent=d.payments;$('paidAmount').textContent=`$${Number(d.paidAmount).toFixed(2)}`;const c=await api('/admin/candidates');$('candidateRows').innerHTML=c.map(x=>`<tr><td>${x.id}</td><td>${x.full_name}</td><td>${x.email}</td><td>${x.preferred_role||''}</td><td>${x.visa_status||''}</td><td>${x.status}</td><td>${x.created_at}</td></tr>`).join('');const p=await api('/admin/payments');$('paymentRows').innerHTML=p.map(x=>`<tr><td>${x.id}</td><td>${x.transaction_id}</td><td>${x.full_name||'—'}</td><td>${x.provider}</td><td>${x.payment_method||''}</td><td>${x.currency} ${(x.amount/100).toFixed(2)}</td><td>${x.status}</td><td>${x.created_at}</td></tr>`).join('');const m=await api('/admin/contacts');$('contactRows').innerHTML=m.map(x=>`<tr><td>${x.id}</td><td>${x.full_name}</td><td>${x.email}</td><td>${x.phone}</td><td>${x.status}</td><td>${x.created_at}</td></tr>`).join('')}
if(token)showDash();</script></body></html>
